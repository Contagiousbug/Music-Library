<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — Music Library</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <h1>♪ Music Library</h1>
      <p>Your personal music collection</p>
    </div>

    <!-- Alerts -->
    <div th:if="${loginError}" class="alert alert-error">
      <span>⚠</span> <span th:text="${loginError}">Invalid credentials.</span>
    </div>
    <div th:if="${logoutMessage}" class="alert alert-success">
      <span>✓</span> <span th:text="${logoutMessage}">Logged out.</span>
    </div>
    <div th:if="${successMessage}" class="alert alert-success">
      <span>✓</span> <span th:text="${successMessage}">Success.</span>
    </div>

    <form th:action="@{/auth/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" name="username" type="text"
               class="form-control" placeholder="Enter your username"
               autocomplete="username" required autofocus/>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" name="password" type="password"
               class="form-control" placeholder="Enter your password"
               autocomplete="current-password" required/>
      </div>

      <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;">
        <label class="form-check">
          <input type="checkbox" name="remember-me"/>
          <span style="font-size:0.85rem;color:var(--text-secondary)">Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-100" style="justify-content:center;padding:12px;">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a th:href="@{/auth/register}">Create one</a>
    </div>

    <!-- Demo credentials hint -->
    <div style="margin-top:24px;padding:14px;background:var(--bg-surface);border-radius:8px;font-size:0.8rem;">
      <div style="color:var(--text-muted);margin-bottom:6px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;font-size:0.68rem;">Demo Credentials</div>
      <div style="color:var(--text-secondary);">👤 <strong style="color:var(--text-primary)">admin</strong> / admin123 <span style="color:var(--text-muted)">(Admin)</span></div>
      <div style="color:var(--text-secondary);margin-top:4px;">👤 <strong style="color:var(--text-primary)">demo</strong> / demo123 <span style="color:var(--text-muted)">(User)</span></div>
    </div>

  </div>
</div>
</body>
</html>
