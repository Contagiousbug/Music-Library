<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Music Library</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <h1>♪ Music Library</h1>
      <p>Create your account</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error">
      <span>⚠</span> <span th:text="${errorMessage}">Error</span>
    </div>

    <form th:action="@{/auth/register}" method="post" th:object="${registrationDto}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" th:field="*{username}" type="text"
               class="form-control" placeholder="Choose a username" required/>
        <div class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input id="email" th:field="*{email}" type="email"
               class="form-control" placeholder="your@email.com" required/>
        <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="displayName">Display Name <span style="color:var(--text-muted)">(optional)</span></label>
        <input id="displayName" th:field="*{displayName}" type="text"
               class="form-control" placeholder="How should we call you?"/>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" th:field="*{password}" type="password"
               class="form-control" placeholder="At least 6 characters" required/>
        <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" th:field="*{confirmPassword}" type="password"
               class="form-control" placeholder="Repeat your password" required/>
        <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
      </div>

      <button type="submit" class="btn btn-primary w-100" style="justify-content:center;padding:12px;">
        Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a th:href="@{/auth/login}">Sign in</a>
    </div>

  </div>
</div>
</body>
</html>
