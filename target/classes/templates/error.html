<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Error — Music Library</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="text-align:center;max-width:440px;">
    <div style="font-size:5rem;margin-bottom:16px;"
         th:text="${errorCode == 404} ? '🔍' : (${errorCode == 403} ? '🚫' : '⚠️')">⚠️</div>
    <h1 class="font-serif" style="font-size:4rem;color:var(--accent);margin-bottom:8px;"
        th:text="${errorCode ?: 500}">500</h1>
    <h2 style="font-size:1.2rem;margin-bottom:12px;"
        th:text="${errorCode == 404} ? 'Page Not Found' : (${errorCode == 403} ? 'Access Denied' : 'Something Went Wrong')">Error</h2>
    <p class="text-secondary" style="margin-bottom:28px;"
       th:text="${errorMessage ?: 'An unexpected error occurred.'}">Error message</p>
    <div style="display:flex;gap:12px;justify-content:center;">
      <a th:href="@{/dashboard}" class="btn btn-primary">Go to Dashboard</a>
      <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
    </div>
  </div>
</div>
</body>
</html>
