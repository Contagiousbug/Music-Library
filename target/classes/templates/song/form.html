<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${songId != null} ? 'Edit Song' : 'Add Song'">Song Form</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/sidebar :: sidebar}" th:with="activePage='add-song'"></div>

  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <a th:href="${songId != null} ? @{/songs/{id}(id=${songId})} : @{/songs}"
           class="btn btn-ghost btn-sm btn-icon">←</a>
        <div class="topbar-title" th:text="${songId != null} ? 'Edit Song' : 'Add New Song'">Form</div>
      </div>
    </div>

    <div class="page-content">
      <div class="card" style="max-width:720px;margin:0 auto;">

        <form th:action="${songId != null} ? @{/songs/{id}/edit(id=${songId})} : @{/songs/new}"
              method="post" th:object="${songDto}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">

            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label">Song Title *</label>
              <input type="text" th:field="*{title}" class="form-control"
                     placeholder="e.g. Bohemian Rhapsody" required/>
              <div class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="form-group">
              <label class="form-label">Artist *</label>
              <input type="text" th:field="*{artist}" class="form-control"
                     placeholder="e.g. Queen" required/>
              <div class="form-error" th:if="${#fields.hasErrors('artist')}" th:errors="*{artist}"></div>
            </div>

            <div class="form-group">
              <label class="form-label">Album</label>
              <input type="text" th:field="*{album}" class="form-control"
                     placeholder="e.g. A Night at the Opera"/>
            </div>

            <div class="form-group">
              <label class="form-label">Genre</label>
              <input type="text" th:field="*{genre}" class="form-control"
                     list="genre-list" placeholder="e.g. Rock, Pop, Jazz…"/>
              <datalist id="genre-list">
                <option th:each="g : ${genres}" th:value="${g}"/>
              </datalist>
            </div>

            <div class="form-group">
              <label class="form-label">Release Year</label>
              <input type="number" th:field="*{releaseYear}" class="form-control"
                     placeholder="e.g. 1975" min="1900" max="2100"/>
              <div class="form-error" th:if="${#fields.hasErrors('releaseYear')}" th:errors="*{releaseYear}"></div>
            </div>

            <div class="form-group">
              <label class="form-label">Duration (seconds)</label>
              <input type="number" th:field="*{durationSeconds}" class="form-control"
                     placeholder="e.g. 354 (= 5:54)" min="1"/>
              <div class="form-hint">Enter total seconds — e.g. 180 for 3:00</div>
              <div class="form-error" th:if="${#fields.hasErrors('durationSeconds')}" th:errors="*{durationSeconds}"></div>
            </div>

            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label">Cover Image URL</label>
              <input type="url" th:field="*{coverImageUrl}" class="form-control"
                     placeholder="https://…/cover.jpg"/>
            </div>

            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label">Audio URL</label>
              <input type="url" th:field="*{audioUrl}" class="form-control"
                     placeholder="https://…/song.mp3"/>
            </div>

            <div class="form-group" style="grid-column:1/-1;">
              <label class="form-label">Lyrics</label>
              <textarea th:field="*{lyrics}" class="form-control" rows="6"
                        placeholder="Paste lyrics here…"></textarea>
            </div>

          </div>

          <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px;">
            <a th:href="${songId != null} ? @{/songs/{id}(id=${songId})} : @{/songs}"
               class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary"
                    th:text="${songId != null} ? 'Update Song' : 'Add Song'">Save</button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
</body>
</html>
