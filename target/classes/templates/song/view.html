<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${song.title + ' — Music Library'}">Song</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/sidebar :: sidebar}" th:with="activePage='songs'"></div>

  <div class="main-content">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <a th:href="@{/songs}" class="btn btn-ghost btn-sm btn-icon">←</a>
        <div class="topbar-title" th:text="${song.title}">Song</div>
      </div>
      <div class="topbar-actions">
        <a th:href="@{/songs/{id}/edit(id=${song.id})}" sec:authorize="hasRole('ADMIN')"
           class="btn btn-secondary btn-sm">Edit Song</a>
        <form th:action="@{/songs/{id}/delete(id=${song.id})}" method="post"
              sec:authorize="hasRole('ADMIN')"
              onsubmit="return confirm('Delete this song permanently?')"
              style="display:inline;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-danger btn-sm">Delete</button>
        </form>
      </div>
    </div>

    <div class="page-content">
      <div th:replace="~{fragments/alerts :: alerts}"></div>

      <!-- Hero section -->
      <div class="card mb-2" style="display:flex;gap:28px;align-items:flex-start;">
        <div style="width:160px;height:160px;border-radius:12px;
                    background:linear-gradient(135deg,#f5a623,#c4841a);
                    display:flex;align-items:center;justify-content:center;
                    font-size:4rem;flex-shrink:0;">
          🎵
        </div>
        <div style="flex:1;">
          <div th:if="${song.genre}">
            <span class="badge badge-genre" th:text="${song.genre}"></span>
          </div>
          <h1 class="font-serif" style="font-size:2rem;margin:10px 0 4px;"
              th:text="${song.title}">Title</h1>
          <p style="font-size:1.1rem;color:var(--text-secondary);" th:text="${song.artist}">Artist</p>
          <p class="text-muted" style="margin-top:4px;" th:if="${song.album}" th:text="${song.album}">Album</p>

          <div style="display:flex;gap:20px;margin-top:16px;flex-wrap:wrap;">
            <div th:if="${song.releaseYear}">
              <span class="text-muted" style="font-size:0.78rem;display:block;">YEAR</span>
              <span style="font-weight:600;" th:text="${song.releaseYear}">2000</span>
            </div>
            <div>
              <span class="text-muted" style="font-size:0.78rem;display:block;">DURATION</span>
              <span style="font-weight:600;" th:text="${song.formattedDuration}">0:00</span>
            </div>
            <div>
              <span class="text-muted" style="font-size:0.78rem;display:block;">PLAYS</span>
              <span style="font-weight:600;" th:text="${song.playCount}">0</span>
            </div>
          </div>

          <div style="display:flex;gap:10px;margin-top:20px;">
            <form th:action="@{/songs/{id}/play(id=${song.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-primary">▶ Play</button>
            </form>
            <a th:href="@{/playlists}" class="btn btn-secondary">Add to Playlist</a>
          </div>
        </div>
      </div>

      <!-- Lyrics -->
      <div class="card" th:if="${song.lyrics}">
        <div class="section-header">
          <span class="section-title">Lyrics</span>
        </div>
        <pre style="white-space:pre-wrap;font-family:'DM Sans',sans-serif;
                    color:var(--text-secondary);line-height:1.8;font-size:0.92rem;"
             th:text="${song.lyrics}"></pre>
      </div>

      <!-- No lyrics placeholder -->
      <div class="card" th:unless="${song.lyrics}"
           style="text-align:center;padding:40px;color:var(--text-muted);">
        <div style="font-size:2rem;margin-bottom:8px;">🎤</div>
        <p>No lyrics available for this song.</p>
      </div>

    </div>
  </div>
</div>
</body>
</html>
