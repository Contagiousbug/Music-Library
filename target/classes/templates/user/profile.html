<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile — Music Library</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/sidebar :: sidebar}" th:with="activePage='profile'"></div>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title">My Profile</div>
    </div>

    <div class="page-content">
      <div th:replace="~{fragments/alerts :: alerts}"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:860px;">

        <!-- Profile Info -->
        <div class="card">
          <div class="section-title mb-2">Profile Information</div>
          <form th:action="@{/users/profile/update}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" th:value="${user.username}" disabled
                     style="opacity:0.6;cursor:not-allowed;"/>
              <div class="form-hint">Username cannot be changed</div>
            </div>

            <div class="form-group">
              <label class="form-label">Display Name</label>
              <input type="text" name="displayName" class="form-control"
                     th:value="${user.displayName}" placeholder="Your display name"/>
            </div>

            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" name="email" class="form-control"
                     th:value="${user.email}" required/>
            </div>

            <div style="margin-top:4px;padding-top:8px;border-top:1px solid var(--border);
                        display:flex;justify-content:space-between;align-items:center;">
              <div class="text-muted" style="font-size:0.78rem;">
                Member since <span th:text="${#temporals.format(user.createdAt,'MMM yyyy')}">Jan 2024</span>
              </div>
              <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
            </div>
          </form>
        </div>

        <!-- Change Password -->
        <div class="card">
          <div class="section-title mb-2">Change Password</div>
          <form th:action="@{/users/profile/change-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
              <label class="form-label">Current Password</label>
              <input type="password" name="currentPassword" class="form-control"
                     placeholder="Your current password" required/>
            </div>

            <div class="form-group">
              <label class="form-label">New Password</label>
              <input type="password" name="newPassword" class="form-control"
                     placeholder="At least 6 characters" minlength="6" required/>
            </div>

            <div class="form-group">
              <label class="form-label">Confirm New Password</label>
              <input type="password" name="confirmNewPassword" class="form-control"
                     placeholder="Repeat new password" required/>
            </div>

            <div style="text-align:right;">
              <button type="submit" class="btn btn-secondary btn-sm">Change Password</button>
            </div>
          </form>
        </div>

        <!-- Stats -->
        <div class="card" style="grid-column:1/-1;">
          <div class="section-title mb-2">My Library Stats</div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon">▤</div>
              <div>
                <div class="stat-value" th:text="${playlistCount}">0</div>
                <div class="stat-label">Playlists Created</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon">🎵</div>
              <div>
                <div class="stat-value" th:text="${#lists.size(playlists)}">0</div>
                <div class="stat-label">Active Playlists</div>
              </div>
            </div>
            <div class="stat-card">
              <div class="stat-icon" style="font-size:0.9rem;">📅</div>
              <div>
                <div class="stat-value" style="font-size:1.1rem;"
                     th:text="${#temporals.format(user.createdAt,'MMM yyyy')}">—</div>
                <div class="stat-label">Member Since</div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
</body>
</html>
